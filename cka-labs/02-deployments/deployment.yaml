apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-deployment
  namespace: cka-practice
spec:
  replicas: 4
  selector:
    matchLabels:
      app: web-deployment
  template:
    metadata:
      labels:
        app: web-deployment
    spec:
      containers:
        - name: nginx
          image: nginx:stable
          ports:
            - containerPort: 80